name: Controle qualite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controle-qualite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: TypeScript, securite et compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier TypeScript
        run: npm run typecheck

      - name: Rechercher les vulnerabilites importantes
        run: npm audit --audit-level=high

      - name: Compiler le site
        run: npm run build
